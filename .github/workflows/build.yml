                              i == idx ? new int[]{Color.parseColor("#FF8F00"), Color.parseColor("#D84315")}
                                       : new int[]{Color.parseColor("#37474F"), Color.parseColor("#263238")});
                      bg.setCornerRadius(dp(10));
                      bg.setStroke(dp(i == idx ? 2 : 1), Color.parseColor(i == idx ? "#FFD700" : "#78909C"));
                      btnVarModes[i].setBackground(bg);
                  }
              }

