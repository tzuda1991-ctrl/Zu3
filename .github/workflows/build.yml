                  btnExit.setOnClickListener(v -> showLobby());
                  topBar.addView(btnExit);

                  tvRoomBadge = new TextView(this);
                  tvRoomBadge.setTextColor(Color.parseColor("#FFD700"));
                  tvRoomBadge.setTextSize(13);
                  tvRoomBadge.setTypeface(null, Typeface.BOLD);
                  tvRoomBadge.setGravity(Gravity.END);
                  LinearLayout.LayoutParams badgeParams = new LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 2f);
                  tvRoomBadge.setLayoutParams(badgeParams);
                  topBar.addView(tvRoomBadge);
                  gameLayout.addView(topBar);

                  tvAdminSpy = new TextView(this);
                  tvAdminSpy.setTextColor(Color.parseColor("#FF5252"));
                  tvAdminSpy.setTextSize(12);
                  tvAdminSpy.setTypeface(null, Typeface.BOLD);
                  tvAdminSpy.setGravity(Gravity.CENTER);
                  tvAdminSpy.setPadding(0, 6, 0, 4);
                  gameLayout.addView(tvAdminSpy);

                  tvOppChips = new TextView(this);
                  tvOppChips.setTextSize(15);
                  tvOppChips.setTextColor(Color.WHITE);
                  tvOppChips.setGravity(Gravity.CENTER);
                  tvOppChips.setPadding(0, 6, 0, 6);
                  gameLayout.addView(tvOppChips);

                  LinearLayout oppCardLayout = new LinearLayout(this);
                  oppCardLayout.setGravity(Gravity.CENTER);
                  for (int i = 0; i < 3; i++) {
                      tvOppCards[i] = createCardView();
                      oppCardLayout.addView(tvOppCards[i]);
                  }
                  gameLayout.addView(oppCardLayout);

                  LinearLayout potBox = new LinearLayout(this);
                  potBox.setOrientation(LinearLayout.VERTICAL);
                  potBox.setGravity(Gravity.CENTER);
                  potBox.setPadding(25, 20, 25, 20);
                  GradientDrawable potBg = new GradientDrawable();
                  potBg.setColor(Color.parseColor("#041F10"));
                  potBg.setCornerRadius(25);
                  potBg.setStroke(4, Color.parseColor("#FFD700"));
                  potBox.setBackground(potBg);
                  LinearLayout.LayoutParams potParams = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  potParams.setMargins(15, 18, 15, 18);
                  potBox.setLayoutParams(potParams);

                  tvVarRuleInfo = new TextView(this);
                  tvVarRuleInfo.setTextSize(13);
                  tvVarRuleInfo.setTextColor(Color.parseColor("#FF80AB"));
                  tvVarRuleInfo.setTypeface(null, Typeface.BOLD);
                  tvVarRuleInfo.setGravity(Gravity.CENTER);
                  potBox.addView(tvVarRuleInfo);

                  tvPot = new TextView(this);
                  tvPot.setTextSize(23);
                  tvPot.setTextColor(Color.parseColor("#00FF88"));
                  tvPot.setTypeface(null, Typeface.BOLD);
                  tvPot.setGravity(Gravity.CENTER);
                  potBox.addView(tvPot);

                  tvStatus = new TextView(this);
                  tvStatus.setTextSize(14);
                  tvStatus.setTextColor(Color.parseColor("#FFEB3B"));
                  tvStatus.setGravity(Gravity.CENTER);
                  tvStatus.setPadding(0, 6, 0, 0);
                  potBox.addView(tvStatus);
                  gameLayout.addView(potBox);

                  LinearLayout playerCardLayout = new LinearLayout(this);
                  playerCardLayout.setGravity(Gravity.CENTER);
                  for (int i = 0; i < 3; i++) {
                      tvPlayerCards[i] = createCardView();
                      playerCardLayout.addView(tvPlayerCards[i]);
                  }
                  gameLayout.addView(playerCardLayout);

                  tvPlayerRole = new TextView(this);
                  tvPlayerRole.setTextSize(13);
                  tvPlayerRole.setTextColor(Color.CYAN);
                  tvPlayerRole.setGravity(Gravity.CENTER);
                  tvPlayerRole.setPadding(0, 6, 0, 4);
                  gameLayout.addView(tvPlayerRole);

                  tvPlayerChips = new TextView(this);
                  tvPlayerChips.setTextSize(17);
                  tvPlayerChips.setTextColor(Color.WHITE);
                  tvPlayerChips.setTypeface(null, Typeface.BOLD);
                  tvPlayerChips.setGravity(Gravity.CENTER);
                  tvPlayerChips.setPadding(0, 0, 0, 12);
                  gameLayout.addView(tvPlayerChips);

                  LinearLayout actionRow = new LinearLayout(this);
                  actionRow.setGravity(Gravity.CENTER);
                  btnSee = createStyledButton("SEE", "#2196F3");
                  btnBet = createStyledButton("BLIND 50", "#4CAF50");
                  btnShow = createStyledButton("SHOW", "#FF9800");
                  btnPack = createStyledButton("PACK", "#F44336");

                  actionRow.addView(btnSee);
                  actionRow.addView(btnBet);
                  actionRow.addView(btnShow);
                  actionRow.addView(btnPack);
                  gameLayout.addView(actionRow);

                  btnNewRound = createStyledButton("DEAL NEXT ROUND ▶", "#9C27B0");
