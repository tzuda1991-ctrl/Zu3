                  /**
                   * Draws an authentic 3D Las-Vegas Casino Chip with Dashed Rim & EXACT Amount (₹200, ₹400, ₹800)!
                   */
                  private void drawAuthenticCasinoChip(Canvas canvas, float cx, float cy, float radius, int amount, boolean isFlying) {
                      // Chip Color based on Denomination: ₹200 = Royal Blue, ₹400 = Crimson Red, ₹800 = Purple, ₹1600+ = Gold
                      String mainHex = "#1E88E5"; // ₹200 Blue
                      if (amount <= 100) mainHex = "#43A047"; // ₹100 Green
                      else if (amount == 400) mainHex = "#E53935"; // ₹400 Red
                      else if (amount == 800) mainHex = "#8E24AA"; // ₹800 Purple
                      else if (amount >= 1600) mainHex = "#FFB300"; // ₹1600 Gold

                      // 1. 3D Chip Edge Thickness & Shadow
                      pFill.setColor(Color.parseColor("#88000000"));
                      canvas.drawCircle(cx + dp(1.5f), cy + dp(3f), radius, pFill);

                      // 2. Main Chip Body Circle
                      pFill.setColor(Color.parseColor(mainHex));
                      canvas.drawCircle(cx, cy, radius, pFill);

                      // 3. Authentic White Dashed Casino Stripe around Outer Edge
                      pDash.setStrokeWidth(dp(2.5f));
                      pDash.setColor(Color.WHITE);
                      canvas.drawCircle(cx, cy, radius - dp(2f), pDash);

                      // 4. Inner Dark Center & Gold Ring
                      pFill.setColor(Color.parseColor("#181818"));
                      canvas.drawCircle(cx, cy, radius * 0.68f, pFill);

                      pStroke.setStrokeWidth(dp(1.2f));
                      pStroke.setColor(Color.parseColor("#FFD700"));
                      canvas.drawCircle(cx, cy, radius * 0.68f, pStroke);

                      // 5. Crisp Exact Denomination Label ("200", "400", "800") - NO MORE '8'!
                      pText.setTextAlign(Paint.Align.CENTER);
                      String valStr = amount >= 1000 ? ("₹" + (amount / 1000f) + "K").replace(".0K", "K") : ("₹" + amount);
                      pText.setTextSize(radius * (isFlying ? 0.52f : 0.54f));
                      pText.setColor(Color.parseColor("#FFD700"));
                      canvas.drawText(valStr, cx, cy + radius * 0.20f, pText);
                  }

                  // ================= VIP PLAYER POD, LAST BET BADGE & CARDS =================

                  private void drawVIPPlayerPodAndCards(Canvas canvas, int idx, float podX, float podY, float cardsX, float cardsY) {
                      boolean isTurn = isGameActive && (currentTurnSeat == idx);
                      boolean isWin = !isGameActive && (winnerSeat == idx);

                      // 1. Sleek Luxury Octro-Style Vertical VIP Card Pod (No messy cartoon leaves!)
                      float podW = dp(98);
                      float podH = dp(86);
                      RectF rPod = new RectF(podX - podW / 2, podY - podH / 2, podX + podW / 2, podY + podH / 2);

                      // Drop Shadow
                      pFill.setColor(Color.parseColor("#99000000"));
                      canvas.drawRoundRect(new RectF(rPod.left + dp(2), rPod.top + dp(3), rPod.right + dp(2), rPod.bottom + dp(3)), dp(14), dp(14), pFill);

                      // Pod Gradient Body
                      pFill.setShader(new LinearGradient(0, rPod.top, 0, rPod.bottom,
                              packed[idx] ? Color.parseColor("#CC263238") : Color.parseColor("#F21E140C"),
                              packed[idx] ? Color.parseColor("#EE11171A") : Color.parseColor("#FA0B0704"),
                              Shader.TileMode.CLAMP));
                      canvas.drawRoundRect(rPod, dp(14), dp(14), pFill);
                      pFill.setShader(null);

                      // Turn Glow Ring or Gold Metallic Frame
                      if (isTurn) {
                          pStroke.setStrokeWidth(dp(3.5f));
                          pStroke.setColor(turnSecondsLeft > 5 ? Color.parseColor("#00E676") : Color.parseColor("#FF1744"));
                          pStroke.setShadowLayer(dp(8), 0, 0, pStroke.getColor());
                          canvas.drawRoundRect(rPod, dp(14), dp(14), pStroke);
                          pStroke.setShadowLayer(0, 0, 0, 0);
                      } else {
                          pStroke.setStrokeWidth(dp(isWin ? 3f : 1.8f));
                          pStroke.setColor(Color.parseColor(isWin ? "#FFD700" : "#C5A059"));
                          canvas.drawRoundRect(rPod, dp(14), dp(14), pStroke);
                      }

                      // 2. Top Avatar Medallion Circle Overlapping Pod Top
                      float avaRad = dp(20);
                      float avaY = rPod.top + dp(6);
                      pFill.setColor(Color.parseColor("#18222C"));
                      canvas.drawCircle(podX, avaY, avaRad, pFill);
                      pStroke.setStrokeWidth(dp(2f));
                      pStroke.setColor(Color.parseColor("#FFD700"));
                      canvas.drawCircle(podX, avaY, avaRad, pStroke);

                      pText.setTextAlign(Paint.Align.CENTER);
                      pText.setTextSize(dp(18));
                      String icon = (idx == 0) ? "👑" : (idx == 1 ? "🕶️" : "👩🏻");
                      canvas.drawText(icon, podX, avaY + dp(6.5f), pText);

                      // Winner Crown / Turn Timer Pill Above Avatar
                      if (isWin) {
                          pText.setTextSize(dp(12));
                          pText.setColor(Color.parseColor("#FFD700"));
                          canvas.drawText("👑 WINNER!", podX, avaY - avaRad - dp(6), pText);
                      } else if (isTurn) {
                          pText.setTextSize(dp(10.5f));
                          pText.setColor(Color.parseColor("#00E676"));
                          canvas.drawText("⏱ " + turnSecondsLeft + "s", podX, avaY - avaRad - dp(6), pText);
                      }

                      if (idx == 0 && System.currentTimeMillis() < emojiExpireTime) {
                          pText.setTextSize(dp(24));
                          canvas.drawText(activeEmoji, rPod.left - dp(22), podY, pText);
                      }

                      // 3. Player Name & Chips Balance inside Pod
                      pText.setTextSize(dp(10.5f));
                      pText.setColor(Color.WHITE);
                      canvas.drawText(seatNames[idx], podX, rPod.top + dp(39), pText);

                      pText.setTextSize(dp(11.5f));
                      pText.setColor(Color.parseColor("#FFD700"));
                      canvas.drawText("₹" + chips[idx], podX, rPod.top + dp(55), pText);

                      // 4. Bottom Status Ribbon inside Pod (BLIND / SEEN / PACKED / HAND RANK)
                      RectF rRibbon = new RectF(rPod.left + dp(8), rPod.bottom - dp(22), rPod.right - dp(8), rPod.bottom - dp(5));
                      int rCol = packed[idx] ? Color.parseColor("#C62828")
                              : (seen[idx] || revealAllCards ? Color.parseColor("#0277BD") : Color.parseColor("#2E7D32"));
                      pFill.setColor(rCol);
                      canvas.drawRoundRect(rRibbon, dp(7), dp(7), pFill);

                      pText.setTextSize(dp(9.5f));
                      pText.setColor(Color.WHITE);
                      canvas.drawText(seatBadges[idx], podX, rRibbon.centerY() + dp(3.5f), pText);

                      // 5. Individual Last Bet Chip Badge next to Pod (Shows "₹200" or "₹400" played by this player!)
                      if (lastSeatBet[idx] > 0 && isGameActive) {
                          float betChipX = (idx == 2) ? (rPod.left - dp(18)) : (rPod.right + dp(18));
                          float betChipY = rPod.top + dp(16);
                          drawAuthenticCasinoChip(canvas, betChipX, betChipY, dp(13.5f), lastSeatBet[idx], false);
                      }

                      // 6. 3 Fanned HD Playing Cards Next to Pod
                      Card[] hCards = hands[idx];
                      if (hCards == null || hCards[0] == null) return;

                      boolean faceUp = (idx == 0 && seen[0]) || revealAllCards;
                      float cw = dp(idx == 0 ? 54 : 48);
                      float ch = dp(idx == 0 ? 76 : 68);
                      float spread = dp(idx == 0 ? 27 : 24) * dealAnimProgress;
                      float[] angles = {-11f, 0f, 11f};

                      for (int c = 0; c < 3; c++) {
                          float cardX = cardsX + (c - 1) * spread;
                          float cardY = cardsY + (c == 1 ? -dp(3) : dp(2));
                          drawRealistic3DCard(canvas, hCards[c], faceUp, isCardWild(hCards[c]), cardX, cardY, cw, ch, angles[c]);
                      }
                  }

                  private void drawRealistic3DCard(Canvas canvas, Card c, boolean faceUp, boolean isWild,
                                                   float cx, float cy, float cw, float ch, float angle) {
                      canvas.save();
                      canvas.translate(cx, cy);
                      canvas.rotate(angle);

                      // Drop Shadow
                      RectF rShadow = new RectF(-cw / 2 + dp(2), -ch / 2 + dp(3), cw / 2 + dp(2), ch / 2 + dp(3));
                      pFill.setColor(Color.parseColor("#77000000"));
                      canvas.drawRoundRect(rShadow, dp(7), dp(7), pFill);

                      RectF rc = new RectF(-cw / 2, -ch / 2, cw / 2, ch / 2);

                      if (!faceUp || c == null) {
                          // Royal Deep Crimson & Gold Luxury Back
                          pFill.setShader(new LinearGradient(0, rc.top, 0, rc.bottom,
                                  Color.parseColor("#9A0007"), Color.parseColor("#3E0002"), Shader.TileMode.CLAMP));
                          canvas.drawRoundRect(rc, dp(7), dp(7), pFill);
                          pFill.setShader(null);

                          pStroke.setStrokeWidth(dp(1.6f));
                          pStroke.setColor(Color.parseColor("#FFD700"));
                          canvas.drawRoundRect(rc, dp(7), dp(7), pStroke);

                          RectF rIn = new RectF(rc.left + dp(4), rc.top + dp(4), rc.right - dp(4), rc.bottom - dp(4));
                          pStroke.setStrokeWidth(dp(0.8f));
                          pStroke.setColor(Color.parseColor("#88FFD700"));
                          canvas.drawRoundRect(rIn, dp(4), dp(4), pStroke);

                          pText.setTextAlign(Paint.Align.CENTER);
                          pText.setTextSize(ch * 0.28f);
                          pText.setColor(Color.parseColor("#FFD700"));
                          canvas.drawText("👑", 0, ch * 0.10f, pText);
                          canvas.restore();
                          return;
                      }

                      // Face Up Card
                      if (isWild) {
                          pFill.setShader(new LinearGradient(0, rc.top, 0, rc.bottom,
                                  Color.parseColor("#FFFDE7"), Color.parseColor("#FFE082"), Shader.TileMode.CLAMP));
                      } else {
                          pFill.setColor(Color.WHITE);
                      }
                      canvas.drawRoundRect(rc, dp(7), dp(7), pFill);
                      pFill.setShader(null);

                      pStroke.setStrokeWidth(dp(isWild ? 2.4f : 1.2f));
                      pStroke.setColor(isWild ? Color.parseColor("#FFA000") : Color.parseColor("#B0BEC5"));
                      canvas.drawRoundRect(rc, dp(7), dp(7), pStroke);

                      int sCol = (c.suit == 1 || c.suit == 2) ? Color.parseColor("#D50000") : Color.parseColor("#111111");
                      pText.setColor(sCol);

                      pText.setTextAlign(Paint.Align.LEFT);
                      pText.setTextSize(ch * 0.23f);
                      canvas.drawText(c.getRankStr(), -cw / 2 + dp(4.5f), -ch / 2 + ch * 0.25f, pText);
                      pText.setTextSize(ch * 0.19f);
                      canvas.drawText(c.getSuitStr(), -cw / 2 + dp(4.5f), -ch / 2 + ch * 0.43f, pText);

                      pText.setTextAlign(Paint.Align.CENTER);
                      pText.setTextSize(ch * 0.40f);
                      canvas.drawText(c.getSuitStr(), dp(2), ch * 0.21f, pText);

                      if (isWild) {
                          pText.setColor(Color.parseColor("#D84315"));
                          pText.setTextSize(ch * 0.14f);
                          canvas.drawText("★WILD", 0, ch * 0.43f, pText);
                      }

                      canvas.restore();
                  }
              }

              // ================= 5. GAMEPLAY & EXACT AMOUNT CHIP ANIMATION ENGINE =================

              private void triggerCardDealAnimation() {
                  ValueAnimator anim = ValueAnimator.ofFloat(0.1f, 1f);
                  anim.setDuration(420);
                  anim.setInterpolator(new DecelerateInterpolator());
                  anim.addUpdateListener(a -> {
                      dealAnimProgress = (float) a.getAnimatedValue();
                      if (tableCanvas != null) tableCanvas.invalidate();
                  });
                  anim.start();
              }

              /**
               * Launches a 3D Casino Chip from the player's seat into the Center Pot with the EXACT bet amount (₹200, ₹400, ₹800)!
               */
              private void animateChipThrowToPot(int fromSeat, int exactAmount) {
                  flyingChipFromSeat = fromSeat;
                  flyingChipAmount = exactAmount;
                  lastSeatBet[fromSeat] = exactAmount;

                  ValueAnimator anim = ValueAnimator.ofFloat(0f, 1f);
                  anim.setDuration(480);
                  anim.setInterpolator(new DecelerateInterpolator());
                  anim.addUpdateListener(a -> {
                      flyingChipProgress = (float) a.getAnimatedValue();
                      if (tableCanvas != null) tableCanvas.invalidate();
                  });
                  anim.addListener(new android.animation.AnimatorListenerAdapter() {
                      @Override
                      public void onAnimationEnd(android.animation.Animator animation) {
                          flyingChipProgress = 1f;
                          addChipTokenToPot(exactAmount);
                          if (tableCanvas != null) tableCanvas.invalidate();
                      }
                  });
                  anim.start();
              }

              private void addChipTokenToPot(int amount) {
                  tablePotChips.add(new ChipToken(
                          -44 + random.nextInt(88),
                          -10 + random.nextInt(20),
                          amount));
              }

              private void initDeck() {
                  deck.clear();
                  for (int s = 0; s < 4; s++) {
                      for (int r = 2; r <= 14; r++) deck.add(new Card(r, s));
                  }
                  Collections.shuffle(deck);
              }

              private void startNewRound() {
                  tablePotChips.clear();
                  flyingPotToWinner = false;
                  potWinAnimProgress = 1f;

                  for (int i = 0; i < 3; i++) {
                      if (chips[i] < 1000) chips[i] = 150000;
                      seen[i] = false;
                      packed[i] = !activeSeat[i];
                      seatBadges[i] = "BLIND";
                      lastSeatBet[i] = activeSeat[i] ? bootAmount : 0;
                  }

                  initDeck();
                  hukamRank = 2 + random.nextInt(13);

                  if (forceTrailNextRound) {
                      hands[0][0] = new Card(14, 0);
                      hands[0][1] = new Card(14, 1);
                      hands[0][2] = new Card(14, 2);
                      forceTrailNextRound = false;
                  } else {
                      for (int c = 0; c < 3; c++) hands[0][c] = deck.remove(0);
                  }

                  for (int s = 1; s < 3; s++) {
                      for (int c = 0; c < 3; c++) hands[s][c] = deck.remove(0);
                  }

                  pot = 0;
                  currentStake = bootAmount;
                  for (int s = 0; s < 3; s++) {
                      if (activeSeat[s]) {
                          chips[s] -= bootAmount;
                          pot += bootAmount;
                          addChipTokenToPot(bootAmount);
                      }
                  }

                  isGameActive = true;
                  revealAllCards = false;
                  winnerSeat = -1;
                  currentTurnSeat = 0;
                  turnSecondsLeft = 15;
                  isStakeDoubledThisTurn = false;

                  statusBanner = "Boot ₹" + bootAmount + " Collected! Play Blind ₹" + currentStake;
                  playSound(ToneGenerator.TONE_PROP_BEEP2, 120);
                  triggerCardDealAnimation();
                  updateHUD();

                  if (isOnlineMode) pushStateToTelegramGroup(statusBanner);
              }

              private void seePlayerCards() {
                  if (!isGameActive || seen[0]) return;
                  seen[0] = true;
                  seatBadges[0] = getVariationHandName(hands[0]);
                  playSound(ToneGenerator.TONE_PROP_ACK, 100);
                  updateHUD();
              }

              private void playerBet() {
                  if (!isGameActive || currentTurnSeat != 0) return;
                  int betAmt = seen[0] ? currentStake * 2 : currentStake;

                  if (chips[0] < betAmt || pot + betAmt >= potLimit) {
                      statusBanner = "Pot Limit Reached! Auto Showdown!";
                      showDown();
                      return;
                  }

                  chips[0] -= betAmt;
                  pot += betAmt;
                  isStakeDoubledThisTurn = false;
                  playSound(ToneGenerator.TONE_PROP_BEEP, 70);

                  // Animate Exact Bet Amount Chip (e.g. ₹200 or ₹400) flying from YOU to POT!
                  animateChipThrowToPot(0, betAmt);

                  statusBanner = "You played " + (seen[0] ? "Chaal ₹" : "Blind ₹") + betAmt;
                  advanceTurn();
              }

              private void playerPack() {
                  if (!isGameActive || currentTurnSeat != 0) return;
                  packed[0] = true;
                  seatBadges[0] = "PACKED";
                  statusBanner = "You Packed!";
                  playSound(ToneGenerator.TONE_PROP_NACK, 120);
                  checkRemainingOrAdvance();
              }

              private void playerSideshow() {
                  if (!isGameActive || currentTurnSeat != 0 || !seen[0]) return;
                  int target = (!packed[1] && seen[1]) ? 1 : ((!packed[2] && seen[2]) ? 2 : -1);
                  if (target == -1) {
                      Toast.makeText(this, "Sideshow requires an active SEEN opponent!", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  int myScore = evaluateVariationHand(hands[0]);
                  int oppScore = evaluateVariationHand(hands[target]);
                  if (myScore >= oppScore) {
                      packed[target] = true;
                      seatBadges[target] = "PACKED";
                      statusBanner = "Sideshow Won! " + seatNames[target] + " Packed!";
                  } else {
                      packed[0] = true;
                      seatBadges[0] = "PACKED";
                      statusBanner = "Sideshow Lost against " + seatNames[target] + "!";
                  }
                  checkRemainingOrAdvance();
              }

              private void advanceTurn() {
                  turnSecondsLeft = 15;
                  if (isOnlineMode) {
                      currentTurnSeat = (currentTurnSeat == 0) ? 1 : 0;
                      updateHUD();
                      pushStateToTelegramGroup(statusBanner);
                      return;
                  }

                  for (int step = 1; step <= 3; step++) {
                      int next = (currentTurnSeat + step) % 3;
                      if (activeSeat[next] && !packed[next]) {
                          currentTurnSeat = next;
                          break;
                      }
                  }
                  updateHUD();

                  if (currentTurnSeat != 0 && isGameActive) {
                      mainHandler.postDelayed(() -> executeBotTurn(currentTurnSeat), 1050);
                  }
              }

              private void checkRemainingOrAdvance() {
                  int alive = 0, last = 0;
                  for (int i = 0; i < 3; i++) {
                      if (activeSeat[i] && !packed[i]) {
                          alive++;
                          last = i;
                      }
                  }
                  if (alive <= 1) {
                      finishRoundWithWinner(last, seatNames[last] + " Wins ₹" + pot + " (Others Packed)!");
                  } else {
                      advanceTurn();
                  }
              }

              private void executeBotTurn(int botSeat) {
                  if (!isGameActive || isOnlineMode || currentTurnSeat != botSeat) return;

                  int score = evaluateVariationHand(hands[botSeat]);
                  int rand = random.nextInt(100);

                  if (!seen[botSeat] && pot >= 800) {
                      seen[botSeat] = true;
                      seatBadges[botSeat] = "SEEN";
                  }

                  int alive = 0;
                  for (int i = 0; i < 3; i++) if (activeSeat[i] && !packed[i]) alive++;

                  if (score < 200000 && pot > 1000 && rand < 35) {
                      packed[botSeat] = true;
                      seatBadges[botSeat] = "PACKED";
                      statusBanner = seatNames[botSeat] + " Packed!";
                      checkRemainingOrAdvance();
                      return;
                  } else if (alive == 2 && pot >= 1800 && rand < 45) {
                      statusBanner = seatNames[botSeat] + " demanded a SHOW!";
                      updateHUD();
                      mainHandler.postDelayed(this::showDown, 850);
                      return;
                  }

                  int betAmt = seen[botSeat] ? currentStake * 2 : currentStake;
                  chips[botSeat] -= betAmt;
                  pot += betAmt;
                  playSound(ToneGenerator.TONE_PROP_BEEP, 60);

                  // Animate Exact Bot Bet Chip (₹200 or ₹400) flying into Pot!
                  animateChipThrowToPot(botSeat, betAmt);

                  statusBanner = seatNames[botSeat] + " played " + (seen[botSeat] ? "Chaal ₹" : "Blind ₹") + betAmt;
                  advanceTurn();
              }

              private void showDown() {
                  if (!isGameActive) return;
                  int bestSeat = 0, bestScore = -1;
                  for (int i = 0; i < 3; i++) {
                      if (activeSeat[i] && !packed[i]) {
                          int sc = evaluateVariationHand(hands[i]);
                          if (sc >= bestScore) {
                              bestScore = sc;
                              bestSeat = i;
                          }
                      }
                  }
                  String winHand = getVariationHandName(hands[bestSeat]);
                  finishRoundWithWinner(bestSeat, seatNames[bestSeat] + " Wins ₹" + pot + " (" + winHand + ")!");
              }

              private void finishRoundWithWinner(int winSeat, String banner) {
                  isGameActive = false;
                  revealAllCards = true;
                  winnerSeat = winSeat;
                  int wonPot = pot;
                  chips[winSeat] += wonPot;
                  pot = 0;
                  statusBanner = banner;
                  playSound(ToneGenerator.TONE_CDMA_ALERT_CALL_GUARD, 250);

                  for (int i = 0; i < 3; i++) {
                      if (activeSeat[i]) seatBadges[i] = getVariationHandName(hands[i]);
                  }

                  // Animate all Pot Chips sweeping to Winner Seat!
                  flyingPotToWinner = true;
                  ValueAnimator winAnim = ValueAnimator.ofFloat(0f, 1f);
                  winAnim.setDuration(650);
                  winAnim.addUpdateListener(a -> {
                      potWinAnimProgress = (float) a.getAnimatedValue();
                      if (tableCanvas != null) tableCanvas.invalidate();
                  });
                  winAnim.addListener(new android.animation.AnimatorListenerAdapter() {
                      @Override
                      public void onAnimationEnd(android.animation.Animator animation) {
                          tablePotChips.clear();
                          flyingPotToWinner = false;
                          if (tableCanvas != null) tableCanvas.invalidate();
                      }
                  });
                  winAnim.start();

                  updateHUD();
                  if (isOnlineMode) pushStateToTelegramGroup(banner);
              }

              private void updateHUD() {
                  int betAmt = seen[0] ? currentStake * 2 : currentStake;
                  btnBetAction.setText((seen[0] ? "CHAAL ₹" : "BLIND ₹") + betAmt);

                  btnSeeCards.setVisibility((isGameActive && !seen[0] && !packed[0]) ? View.VISIBLE : View.GONE);

                  int alive = 0;
                  for (int i = 0; i < 3; i++) if (activeSeat[i] && !packed[i]) alive++;

                  boolean myTurn = isGameActive && (currentTurnSeat == 0) && !packed[0];
                  btnBetAction.setEnabled(myTurn);
                  btnPack.setEnabled(myTurn);
                  btnShow.setEnabled(myTurn && alive == 2);
                  btnSideshow.setEnabled(myTurn && seen[0] && alive >= 2);
                  btnPlus.setEnabled(myTurn && !isStakeDoubledThisTurn);
                  btnMinus.setEnabled(myTurn && isStakeDoubledThisTurn);
                  btnNextDeal.setEnabled(!isGameActive);

                  if (tableCanvas != null) tableCanvas.invalidate();
              }

              private void startTurnTimerLoop() {
                  Runnable r = new Runnable() {
                      @Override
                      public void run() {
                          if (isGameActive) {
                              turnSecondsLeft--;
                              if (turnSecondsLeft <= 0) {
                                  if (currentTurnSeat == 0) playerPack();
                                  else advanceTurn();
                              }
                              if (tableCanvas != null) tableCanvas.invalidate();
                          }
                          mainHandler.postDelayed(this, 1000);
                      }
                  };
                  mainHandler.postDelayed(r, 1000);
              }

              // ================= TELEGRAM ONLINE SERVER SYNC =================

              private void createTelegramRoom() {
                  String code = etRoomId.getText().toString().trim();
                  if (code.isEmpty()) code = String.valueOf(1000 + random.nextInt(9000));
                  currentRoomId = code;
                  isOnlineMode = true;
                  isHost = true;
                  activeSeat[0] = true;
                  activeSeat[1] = true;
                  activeSeat[2] = false;
                  seatNames[1] = "PLAYER 2";
                  stateVersion = 1;
                  showGameTable();
                  startNewRound();
                  sendTelegramLog(TG_GROUP_ID, "🎲 *[V8 ROYAL ROOM CREATED]* Code: `" + currentRoomId + "`");
              }

              private void joinTelegramRoom() {
                  String code = etRoomId.getText().toString().trim();
                  if (code.isEmpty()) {
                      Toast.makeText(this, "Enter Room Code first!", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  currentRoomId = code;
                  isOnlineMode = true;
                  isHost = false;
                  activeSeat[0] = true;
                  activeSeat[1] = true;
                  activeSeat[2] = false;
                  seatNames[1] = "HOST P1";
                  stateVersion = 0;
                  showGameTable();
                  statusBanner = "Syncing Room " + currentRoomId + "...";
                  pullStateFromTelegramGroup();
                  sendTelegramLog(TG_GROUP_ID, "👤 *[PLAYER 2 JOINED]* Room: `" + currentRoomId + "`");
              }

              private void pushStateToTelegramGroup(String msg) {
                  if (!isOnlineMode) return;
                  stateVersion++;
                  networkExecutor.execute(() -> {
                      try {
                          JSONObject d = new JSONObject();
                          d.put("r", currentRoomId);
                          d.put("v", stateVersion);
                          d.put("g", currentVariation);
                          d.put("j", hukamRank);
                          d.put("p", pot);
                          d.put("s", currentStake);
                          d.put("t", isHost ? (currentTurnSeat == 0 ? "1" : "2") : (currentTurnSeat == 0 ? "2" : "1"));
                          d.put("a", isGameActive ? 1 : 0);
                          d.put("m", msg.length() > 36 ? msg.substring(0, 36) : msg);
                          d.put("c1", isHost ? chips[0] : chips[1]);
                          d.put("c2", isHost ? chips[1] : chips[0]);
                          d.put("h1", encodeHand(isHost ? hands[0] : hands[1]));
                          d.put("h2", encodeHand(isHost ? hands[1] : hands[0]));

                          String descUrl = "https://api.telegram.org/bot" + TG_BOT_TOKEN
                                  + "/setChatDescription?chat_id=" + TG_GROUP_ID
                                  + "&description=" + URLEncoder.encode(d.toString(), "UTF-8");
                          HttpURLConnection conn = (HttpURLConnection) new URL(descUrl).openConnection();
                          conn.setRequestMethod("GET");
                          conn.getResponseCode();
                          conn.disconnect();

                          sendTelegramLog(TG_GROUP_ID, "🃏 *Room " + currentRoomId + "* | Pot: ₹" + pot + "\n📢 " + msg);
                      } catch (Exception ignored) {}
                  });
              }

              private void pullStateFromTelegramGroup() {
                  if (!isOnlineMode) return;
                  networkExecutor.execute(() -> {
                      try {
                          String urlStr = "https://api.telegram.org/bot" + TG_BOT_TOKEN + "/getChat?chat_id=" + TG_GROUP_ID;
                          HttpURLConnection conn = (HttpURLConnection) new URL(urlStr).openConnection();
                          conn.setRequestMethod("GET");
                          BufferedReader br = new BufferedReader(new InputStreamReader(conn.getInputStream()));
                          StringBuilder sb = new StringBuilder();
                          String line;
                          while ((line = br.readLine()) != null) sb.append(line);
                          conn.disconnect();

                          JSONObject res = new JSONObject(sb.toString());
                          if (!res.optBoolean("ok", false)) return;

                          String desc = res.getJSONObject("result").optString("description", "");
                          if (!desc.startsWith("{")) return;

                          JSONObject d = new JSONObject(desc);
                          if (!d.optString("r", "").equals(currentRoomId)) return;

                          int remoteVer = d.optInt("v", 0);
                          if (remoteVer <= stateVersion) return;
                          stateVersion = remoteVer;

                          mainHandler.post(() -> {
                              currentVariation = d.optInt("g", 0);
                              hukamRank = d.optInt("j", 14);
                              int newPot = d.optInt("p", 200);
                              int diff = Math.max(200, newPot - pot);
                              pot = newPot;
                              currentStake = d.optInt("s", 200);
                              boolean prevActive = isGameActive;
                              isGameActive = d.optInt("a", 1) == 1;
                              String turn = d.optString("t", "1");
                              boolean myTurn = (isHost && turn.equals("1")) || (!isHost && turn.equals("2"));
                              currentTurnSeat = myTurn ? 0 : 1;

                              chips[0] = isHost ? d.optInt("c1", 150000) : d.optInt("c2", 150000);
                              chips[1] = isHost ? d.optInt("c2", 150000) : d.optInt("c1", 150000);

                              Card[] p1 = decodeHand(d.optString("h1", ""));
                              Card[] p2 = decodeHand(d.optString("h2", ""));
                              if (p1 != null && p2 != null) {
                                  hands[0] = isHost ? p1 : p2;
                                  hands[1] = isHost ? p2 : p1;
                              }

                              statusBanner = d.optString("m", "Game On");
                              animateChipThrowToPot(1, diff);

                              if (!isGameActive && prevActive) {
                                  revealAllCards = true;
                                  seatBadges[0] = getVariationHandName(hands[0]);
                                  seatBadges[1] = getVariationHandName(hands[1]);
                              } else if (isGameActive && !prevActive) {
                                  revealAllCards = false;
                                  seen[0] = false;
                                  seen[1] = false;
                                  seatBadges[0] = "BLIND";
                                  seatBadges[1] = "BLIND";
                              }
                              updateHUD();
                          });
                      } catch (Exception ignored) {}
                  });
              }

              // ================= HAND EVALUATOR =================

              private boolean isCardWild(Card c) {
                  if (c == null) return false;
                  if (currentVariation == 2) return c.rank == 14 || c.rank == 13 || c.rank == 4 || c.rank == 7;
                  if (currentVariation == 3) return c.rank == hukamRank;
                  return false;
              }

              private int evaluateVariationHand(Card[] hand) {
                  if (hand == null || hand[0] == null) return 0;
                  if (currentVariation == 1) return 1000000 - evaluateStandardHand(hand);
                  if (currentVariation == 2 || currentVariation == 3) return evaluateBestWildHand(hand);
                  return evaluateStandardHand(hand);
              }

              private int evaluateBestWildHand(Card[] hand) {
                  boolean w0 = isCardWild(hand[0]), w1 = isCardWild(hand[1]), w2 = isCardWild(hand[2]);
                  if (!w0 && !w1 && !w2) return evaluateStandardHand(hand);
                  if (w0 && w1 && w2) return 600014;

                  int maxScore = 0;
                  List<Card> p0 = w0 ? getAll52Cards() : Collections.singletonList(hand[0]);
                  List<Card> p1 = w1 ? getAll52Cards() : Collections.singletonList(hand[1]);
                  List<Card> p2 = w2 ? getAll52Cards() : Collections.singletonList(hand[2]);

                  Card[] temp = new Card[3];
                  for (Card c0 : p0) {
                      temp[0] = c0;
                      for (Card c1 : p1) {
                          temp[1] = c1;
                          for (Card c2 : p2) {
                              temp[2] = c2;
                              int s = evaluateStandardHand(temp);
                              if (s > maxScore) maxScore = s;
                          }
                      }
                  }
                  return maxScore;
              }

              private List<Card> getAll52Cards() {
                  List<Card> all = new ArrayList<>(52);
                  for (int s = 0; s < 4; s++) {
                      for (int r = 2; r <= 14; r++) all.add(new Card(r, s));
                  }
                  return all;
              }

              private int evaluateStandardHand(Card[] hand) {
                  int[] r = {hand[0].rank, hand[1].rank, hand[2].rank};
                  Arrays.sort(r);
                  boolean flush = (hand[0].suit == hand[1].suit) && (hand[1].suit == hand[2].suit);
                  boolean straight = (r[2] - r[1] == 1 && r[1] - r[0] == 1) || (r[0] == 2 && r[1] == 3 && r[2] == 14);
                  int seqHigh = (r[0] == 2 && r[1] == 3 && r[2] == 14) ? 13 : r[2];

                  if (r[0] == r[1] && r[1] == r[2]) return 600000 + r[2];
                  if (flush && straight) return 500000 + seqHigh;
                  if (straight) return 400000 + seqHigh;
                  if (flush) return 300000 + r[2] * 256 + r[1] * 16 + r[0];
                  if (r[0] == r[1] || r[1] == r[2]) {
                      int pair = r[1];
                      int kicker = (r[0] == r[1]) ? r[2] : r[0];
                      return 200000 + pair * 20 + kicker;
                  }
                  return 100000 + r[2] * 256 + r[1] * 16 + r[0];
              }

              private String getVariationHandName(Card[] hand) {
                  if (currentVariation == 1) return "LOW:" + getStandardName(evaluateStandardHand(hand));
                  int score = (currentVariation == 2 || currentVariation == 3)
                          ? evaluateBestWildHand(hand)
                          : evaluateStandardHand(hand);
                  return getStandardName(score);
              }

              private String getStandardName(int rawScore) {
                  switch (rawScore / 100000) {
                      case 6: return "TRAIL";
                      case 5: return "PURE SEQ";
                      case 4: return "SEQUENCE";
                      case 3: return "COLOR";
                      case 2: return "PAIR";
                      default: return "HIGH CARD";
                  }
              }

