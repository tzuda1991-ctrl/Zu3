              private class CasinoTableCanvas extends View {
                  private Paint pBg = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Paint pWood = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Paint pGold = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Paint pFelt = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Paint pLine = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private RectF rOuter = new RectF();
                  private RectF rFelt = new RectF();
                  private RectF rInnerLine = new RectF();
                  private boolean isLobbyBg;

                  CasinoTableCanvas(Context c, boolean isLobbyBg) {
                      super(c);
                      this.isLobbyBg = isLobbyBg;
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      int w = getWidth();
                      int h = getHeight();

                      // Dark Royal Room Background
                      pBg.setShader(new RadialGradient(w / 2f, h / 2f, Math.max(w, h) * 0.7f,
                              Color.parseColor("#1B0808"), Color.parseColor("#050101"), Shader.TileMode.CLAMP));
                      canvas.drawRect(0, 0, w, h, pBg);

                      float marginX = w * 0.05f;
                      float marginTop = h * 0.08f;
                      float marginBot = h * 0.14f;

                      rOuter.set(marginX, marginTop, w - marginX, h - marginBot);

                      // Outer Mahogany Wood Rim
                      pWood.setShader(new LinearGradient(0, marginTop, 0, h - marginBot,
                              Color.parseColor("#4E1A09"), Color.parseColor("#240A03"), Shader.TileMode.CLAMP));
                      canvas.drawOval(rOuter, pWood);

                      // Gold Trim Ring
                      pGold.setStyle(Paint.Style.STROKE);
                      pGold.setStrokeWidth(dp(3));
                      pGold.setColor(Color.parseColor("#FFD700"));
                      canvas.drawOval(rOuter, pGold);

                      // Green Velvet Felt Inside
                      float rim = dp(18);
                      rFelt.set(rOuter.left + rim, rOuter.top + rim, rOuter.right - rim, rOuter.bottom - rim);
                      pFelt.setShader(new RadialGradient(w / 2f, rFelt.centerY(), rFelt.width() * 0.55f,
                              Color.parseColor(isLobbyBg ? "#0A4D28" : "#117A3E"),
                              Color.parseColor("#042813"), Shader.TileMode.CLAMP));
                      canvas.drawOval(rFelt, pFelt);

                      // Inner Casino Betting Ring Line
                      float inRim = dp(16);
                      rInnerLine.set(rFelt.left + inRim, rFelt.top + inRim, rFelt.right - inRim, rFelt.bottom - inRim);
                      pLine.setStyle(Paint.Style.STROKE);
                      pLine.setStrokeWidth(dp(1));
                      pLine.setColor(Color.parseColor("#55FFD700"));
                      canvas.drawOval(rInnerLine, pLine);
                  }
              }

