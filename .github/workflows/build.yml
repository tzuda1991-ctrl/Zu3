              // ================= CUSTOM 3D GLOSSY GLASS BUTTON =================

              private class Glossy3DButton extends View {
                  private String label;
                  private int iconType; // 0=none, 1=pack_cards, 2=eye, 3=spade, 4=play, 5=back, 6=info
                  private int cTop, cMid, cBot, cStroke;
                  private float textSp;
                  private boolean isEnabledState = true;
                  private boolean isPressedState = false;
                  private Paint pFill = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Paint pGloss = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Paint pStroke = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Paint pGlow = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Paint pText = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Paint pIcon = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private RectF rBtn = new RectF();
                  private RectF rGloss = new RectF();

                  Glossy3DButton(Context ctx, String text, int iconType, String topHex, String botHex, String strokeHex, float sp) {
                      super(ctx);
                      this.label = text;
                      this.iconType = iconType;
                      this.cTop = Color.parseColor(topHex);
                      this.cBot = Color.parseColor(botHex);
                      this.cStroke = Color.parseColor(strokeHex);
                      this.textSp = sp;
                      pText.setTypeface(Typeface.create(Typeface.DEFAULT, Typeface.BOLD));
                      pText.setFakeBoldText(true);
                      setClickable(true);
                  }

                  void setText(String t) {
                      this.label = t;
                      invalidate();
                  }

                  void setColors(String topHex, String botHex, String strokeHex) {
                      this.cTop = Color.parseColor(topHex);
                      this.cBot = Color.parseColor(botHex);
                      this.cStroke = Color.parseColor(strokeHex);
                      invalidate();
                  }

                  @Override
                  public void setEnabled(boolean enabled) {
                      super.setEnabled(enabled);
                      this.isEnabledState = enabled;
                      setAlpha(enabled ? 1.0f : 0.55f);
                      invalidate();
                  }

                  @Override
                  public boolean onTouchEvent(MotionEvent event) {
                      if (!isEnabledState) return false;
                      if (event.getAction() == MotionEvent.ACTION_DOWN) {
                          isPressedState = true;
                          setScaleX(0.95f);
                          setScaleY(0.95f);
                          invalidate();
                      } else if (event.getAction() == MotionEvent.ACTION_UP || event.getAction() == MotionEvent.ACTION_CANCEL) {
                          isPressedState = false;
                          setScaleX(1.0f);
                          setScaleY(1.0f);
                          invalidate();
                      }
                      return super.onTouchEvent(event);
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      int w = getWidth();
                      int h = getHeight();
                      if (w <= 0 || h <= 0) return;

                      float pad = dp(3);
                      rBtn.set(pad, pad, w - pad, h - pad);
                      float rad = h * 0.46f;

                      // 1. Rich 3D Vertical Bevel Gradient
                      pFill.setShader(new LinearGradient(0, rBtn.top, 0, rBtn.bottom,
                              cTop, cBot, Shader.TileMode.CLAMP));
                      canvas.drawRoundRect(rBtn, rad, rad, pFill);

                      // 2. Top Half Glass Reflection Shine (Exactly like 2nd Pic!)
                      rGloss.set(rBtn.left + dp(3), rBtn.top + dp(2), rBtn.right - dp(3), rBtn.top + rBtn.height() * 0.48f);
                      pGloss.setShader(new LinearGradient(0, rGloss.top, 0, rGloss.bottom,
                              Color.argb(120, 255, 255, 255), Color.argb(10, 255, 255, 255), Shader.TileMode.CLAMP));
                      canvas.drawRoundRect(rGloss, rad * 0.8f, rad * 0.8f, pGloss);

                      // 3. Outer Metallic / Neon Rim
                      pStroke.setStyle(Paint.Style.STROKE);
                      pStroke.setStrokeWidth(dp(2.2f));
                      pStroke.setColor(cStroke);
                      canvas.drawRoundRect(rBtn, rad, rad, pStroke);

                      // Inner thin highlight ring
                      RectF rIn = new RectF(rBtn.left + dp(2), rBtn.top + dp(2), rBtn.right - dp(2), rBtn.bottom - dp(2));
                      pStroke.setStrokeWidth(dp(0.8f));
                      pStroke.setColor(Color.argb(90, 255, 255, 255));
                      canvas.drawRoundRect(rIn, rad, rad, pStroke);

                      // 4. Vector Icon + Crisp Shadowed Text
                      pText.setTextSize(dp(textSp));
                      pText.setColor(Color.WHITE);
                      pText.setShadowLayer(dp(3), 0, dp(1.5f), Color.parseColor("#AA000000"));

                      float centerY = h * 0.5f + dp(textSp * 0.34f);

                      if (iconType == 0) {
                          pText.setTextAlign(Paint.Align.CENTER);
                          canvas.drawText(label, w * 0.5f, centerY, pText);
                      } else {
                          pText.setTextAlign(Paint.Align.LEFT);
                          float textW = pText.measureText(label);
                          float iconW = dp(18);
                          float totalW = iconW + dp(6) + textW;
                          float startX = (w - totalW) * 0.5f;

                          drawButtonIcon(canvas, iconType, startX + iconW * 0.5f, h * 0.5f, dp(7.5f));
                          canvas.drawText(label, startX + iconW + dp(6), centerY, pText);
                      }
                  }

                  private void drawButtonIcon(Canvas canvas, int type, float cx, float cy, float r) {
                      pIcon.setStyle(Paint.Style.FILL);
                      pIcon.setColor(Color.WHITE);
                      if (type == 1) { // Pack Folded Cards Icon
                          canvas.save();
                          canvas.translate(cx, cy);
                          canvas.rotate(-12f);
                          canvas.drawRoundRect(new RectF(-r * 0.8f, -r, r * 0.4f, r * 0.9f), dp(2), dp(2), pIcon);
                          canvas.rotate(22f);
                          pIcon.setColor(Color.parseColor("#FFCDD2"));
                          canvas.drawRoundRect(new RectF(-r * 0.4f, -r, r * 0.8f, r * 0.9f), dp(2), dp(2), pIcon);
                          canvas.restore();
                      } else if (type == 2) { // Sideshow Eye Icon
                          pIcon.setStyle(Paint.Style.STROKE);
                          pIcon.setStrokeWidth(dp(2));
                          RectF eyeR = new RectF(cx - r * 1.2f, cy - r * 0.7f, cx + r * 1.2f, cy + r * 0.7f);
                          canvas.drawOval(eyeR, pIcon);
                          pIcon.setStyle(Paint.Style.FILL);
                          canvas.drawCircle(cx, cy, r * 0.4f, pIcon);
                      } else if (type == 3) { // Show Spade Icon
                          pText.setTextAlign(Paint.Align.CENTER);
                          canvas.drawText("♠", cx, cy + dp(5), pText);
                      } else if (type == 4) { // Next Hand Play Triangle
                          Path path = new Path();
                          path.moveTo(cx - r * 0.6f, cy - r * 0.85f);
                          path.lineTo(cx + r * 0.9f, cy);
                          path.lineTo(cx - r * 0.6f, cy + r * 0.85f);
                          path.close();
                          canvas.drawPath(path, pIcon);
                      } else if (type == 5) { // Left Arrow
                          pText.setTextAlign(Paint.Align.CENTER);
                          canvas.drawText("←", cx, cy + dp(5), pText);
                      } else if (type == 6) { // Info Circle
                          canvas.drawCircle(cx, cy, r * 0.95f, pIcon);
                          pIcon.setColor(Color.parseColor("#6A1B9A"));
                          pIcon.setTextAlign(Paint.Align.CENTER);
                          pIcon.setTextSize(dp(10));
                          pIcon.setTypeface(Typeface.DEFAULT_BOLD);
                          canvas.drawText("i", cx, cy + dp(3.5f), pIcon);
                      }
                  }
              }

