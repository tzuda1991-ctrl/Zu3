              private class PlayingCardView extends View {
                  private Card card;
                  private boolean faceUp = false;
                  private boolean isWild = false;
                  private Paint pCard = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Paint pBorder = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Paint pText = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Paint pPattern = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private RectF rect = new RectF();
                  private RectF innerRect = new RectF();

                  PlayingCardView(Context c) {
                      super(c);
                      pText.setTypeface(Typeface.create(Typeface.DEFAULT, Typeface.BOLD));
                  }

                  void setCardData(Card c, boolean up, boolean wild) {
                      this.card = c;
                      this.faceUp = up;
                      this.isWild = wild;
                      invalidate();
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      int w = getWidth();
                      int h = getHeight();
                      rect.set(dp(2), dp(2), w - dp(2), h - dp(2));

                      if (!faceUp || card == null) {
                          // Royal Red & Gold Back Pattern
                          pCard.setColor(Color.parseColor("#9A0007"));
                          canvas.drawRoundRect(rect, dp(8), dp(8), pCard);

                          pBorder.setStyle(Paint.Style.STROKE);
                          pBorder.setStrokeWidth(dp(2));
                          pBorder.setColor(Color.parseColor("#FFD700"));
                          canvas.drawRoundRect(rect, dp(8), dp(8), pBorder);

                          innerRect.set(dp(6), dp(6), w - dp(6), h - dp(6));
                          pPattern.setStyle(Paint.Style.STROKE);
                          pPattern.setStrokeWidth(dp(1));
                          pPattern.setColor(Color.parseColor("#88FFD700"));
                          canvas.drawRoundRect(innerRect, dp(5), dp(5), pPattern);

                          pText.setColor(Color.parseColor("#FFD700"));
                          pText.setTextSize(h * 0.28f);
                          pText.setTextAlign(Paint.Align.CENTER);
