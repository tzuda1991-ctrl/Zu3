              // ================= CUSTOM 3D ROYAL METALLIC BUTTON =================

              private class RoyalButton extends View {
                  private String label;
                  private int iconType;
                  private int cTop, cBot, cStroke;
                  private float textSp;
                  private boolean isEnabledState = true;
                  private Paint pFill = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Paint pGloss = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Paint pStroke = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Paint pText = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Paint pIcon = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private RectF rBtn = new RectF();
                  private RectF rGloss = new RectF();

                  RoyalButton(Context ctx, String text, int iconType, String topHex, String botHex, String strokeHex, float sp) {
                      super(ctx);
                      this.label = text;
                      this.iconType = iconType;
                      this.cTop = Color.parseColor(topHex);
                      this.cBot = Color.parseColor(botHex);
                      this.cStroke = Color.parseColor(strokeHex);
                      this.textSp = sp;
                      pText.setTypeface(Typeface.create(Typeface.DEFAULT, Typeface.BOLD));
                      pText.setFakeBoldText(true);
                      setClickable(true);
                  }

                  void setText(String t) {
                      this.label = t;
                      invalidate();
                  }

                  void setColors(String topHex, String botHex, String strokeHex) {
                      this.cTop = Color.parseColor(topHex);
                      this.cBot = Color.parseColor(botHex);
                      this.cStroke = Color.parseColor(strokeHex);
                      invalidate();
                  }

                  @Override
                  public void setEnabled(boolean enabled) {
                      super.setEnabled(enabled);
                      this.isEnabledState = enabled;
                      setAlpha(enabled ? 1.0f : 0.48f);
                      invalidate();
                  }

                  @Override
                  public boolean onTouchEvent(MotionEvent event) {
                      if (!isEnabledState) return false;
                      if (event.getAction() == MotionEvent.ACTION_DOWN) {
                          setScaleX(0.94f);
                          setScaleY(0.94f);
                      } else if (event.getAction() == MotionEvent.ACTION_UP || event.getAction() == MotionEvent.ACTION_CANCEL) {
                          setScaleX(1.0f);
                          setScaleY(1.0f);
                      }
                      return super.onTouchEvent(event);
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      int w = getWidth();
                      int h = getHeight();
                      if (w <= 0 || h <= 0) return;

                      float pad = dp(2.5f);
                      rBtn.set(pad, pad, w - pad, h - pad);
                      float rad = dp(12);

                      // Drop Shadow
                      pFill.setColor(Color.parseColor("#88000000"));
                      canvas.drawRoundRect(new RectF(rBtn.left, rBtn.top + dp(2), rBtn.right, rBtn.bottom + dp(2)), rad, rad, pFill);

                      // 3D Main Gradient
                      pFill.setShader(new LinearGradient(0, rBtn.top, 0, rBtn.bottom, cTop, cBot, Shader.TileMode.CLAMP));
                      canvas.drawRoundRect(rBtn, rad, rad, pFill);
                      pFill.setShader(null);

                      // Top Glass Shine
                      rGloss.set(rBtn.left + dp(2), rBtn.top + dp(1.5f), rBtn.right - dp(2), rBtn.top + rBtn.height() * 0.45f);
                      pGloss.setShader(new LinearGradient(0, rGloss.top, 0, rGloss.bottom,
                              Color.argb(110, 255, 255, 255), Color.argb(0, 255, 255, 255), Shader.TileMode.CLAMP));
                      canvas.drawRoundRect(rGloss, rad * 0.8f, rad * 0.8f, pGloss);

                      // Metallic Gold / Colored Rim
                      pStroke.setStyle(Paint.Style.STROKE);
                      pStroke.setStrokeWidth(dp(2f));
                      pStroke.setColor(cStroke);
                      canvas.drawRoundRect(rBtn, rad, rad, pStroke);

                      pText.setTextSize(dp(textSp));
                      pText.setColor(Color.WHITE);
                      pText.setShadowLayer(dp(2.5f), 0, dp(1.5f), Color.BLACK);

                      float centerY = h * 0.5f + dp(textSp * 0.34f);

                      if (iconType == 0) {
                          pText.setTextAlign(Paint.Align.CENTER);
                          canvas.drawText(label, w * 0.5f, centerY, pText);
                      } else {
                          pText.setTextAlign(Paint.Align.LEFT);
                          float textW = pText.measureText(label);
                          float iconW = dp(16);
                          float totalW = iconW + dp(5) + textW;
                          float startX = (w - totalW) * 0.5f;
                          drawIcon(canvas, iconType, startX + iconW * 0.5f, h * 0.5f, dp(7));
                          canvas.drawText(label, startX + iconW + dp(5), centerY, pText);
                      }
                  }

                  private void drawIcon(Canvas canvas, int type, float cx, float cy, float r) {
                      pIcon.setStyle(Paint.Style.FILL);
                      pIcon.setColor(Color.WHITE);
                      if (type == 1) { // Folded Cards
                          canvas.save();
                          canvas.translate(cx, cy);
                          canvas.rotate(-10f);
                          canvas.drawRoundRect(new RectF(-r * 0.7f, -r, r * 0.4f, r * 0.85f), dp(2), dp(2), pIcon);
                          canvas.rotate(20f);
                          pIcon.setColor(Color.parseColor("#FFCDD2"));
                          canvas.drawRoundRect(new RectF(-r * 0.4f, -r, r * 0.7f, r * 0.85f), dp(2), dp(2), pIcon);
                          canvas.restore();
                      } else if (type == 2) { // Eye
                          pIcon.setStyle(Paint.Style.STROKE);
                          pIcon.setStrokeWidth(dp(1.8f));
                          canvas.drawOval(new RectF(cx - r * 1.15f, cy - r * 0.65f, cx + r * 1.15f, cy + r * 0.65f), pIcon);
                          pIcon.setStyle(Paint.Style.FILL);
                          canvas.drawCircle(cx, cy, r * 0.38f, pIcon);
                      } else if (type == 3) { // Spade
                          pText.setTextAlign(Paint.Align.CENTER);
                          canvas.drawText("♠", cx, cy + dp(4.5f), pText);
                      } else if (type == 4) { // Play Triangle
                          Path path = new Path();
                          path.moveTo(cx - r * 0.5f, cy - r * 0.8f);
                          path.lineTo(cx + r * 0.85f, cy);
                          path.lineTo(cx - r * 0.5f, cy + r * 0.8f);
                          path.close();
                          canvas.drawPath(path, pIcon);
                      } else if (type == 5) { // Back
                          pText.setTextAlign(Paint.Align.CENTER);
                          canvas.drawText("⬅", cx, cy + dp(4.5f), pText);
                      } else if (type == 6) { // Info
                          pText.setTextAlign(Paint.Align.CENTER);
                          canvas.drawText("ⓘ", cx, cy + dp(4.5f), pText);
                      }
                  }
              }

