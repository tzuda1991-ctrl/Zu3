              private void generateProceduralFeltTexture() {
                  int size = 120;
                  feltNoiseBitmap = Bitmap.createBitmap(size, size, Bitmap.Config.ARGB_8888);
                  int[] pixels = new int[size * size];
                  Random r = new Random(777);
                  for (int i = 0; i < pixels.length; i++) {
                      int shade = r.nextInt(18);
                      pixels[i] = Color.argb(28, shade, 110 + shade, 45 + shade);
                  }
                  feltNoiseBitmap.setPixels(pixels, 0, size, 0, 0, size, size);
              }

              private void playSound(int tone, int dur) {
