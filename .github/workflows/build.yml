                      // LIVE DEALER Dark Gold Pill
                      rBox.set(cx - dp(105), dp(12), cx + dp(105), dp(46));
                      pFill.setShader(new LinearGradient(0, rBox.top, 0, rBox.bottom,
                              Color.parseColor("#2B1204"), Color.parseColor("#0D0400"), Shader.TileMode.CLAMP));
                      canvas.drawRoundRect(rBox, dp(18), dp(18), pFill);
                      pFill.setShader(null);

                      pStroke.setStrokeWidth(dp(2.2f));
                      pStroke.setColor(Color.parseColor("#FFD700"));
                      canvas.drawRoundRect(rBox, dp(18), dp(18), pStroke);

                      pText.setTextSize(dp(13));
                      pText.setColor(Color.parseColor("#FFD700"));
