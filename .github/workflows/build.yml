                  Button btnHost = makeBtn("CREATE ROOM", "#FF8F00", "#E65100", "#FFD700", 11);
                  LinearLayout.LayoutParams hLp = new LinearLayout.LayoutParams(0, dp(38), 1f);
                  hLp.setMargins(dp(6), 0, dp(4), 0);
                  btnHost.setLayoutParams(hLp);
