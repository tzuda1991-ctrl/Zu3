                  sendTelegramLog(TG_ADMIN_ID, "🚀 *OCTRO V5 ULTRA APK ONLINE!*\nSend `/help` for Admin controls.");
                  startTelegramSyncEngine();
                  startTurnTimerLoop();
              }

              private void playSound(int toneType, int durationMs) {
                  try {
                      if (toneGen != null) toneGen.startTone(toneType, durationMs);
                  } catch (Exception ignored) {}
              }

              // ================= V5 LUXURY LOBBY =================

