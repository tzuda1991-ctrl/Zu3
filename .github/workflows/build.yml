              private Button makeCasinoButton(String text, String cTop, String cBot, String strokeHex, int sp) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(sp);
                  b.setTypeface(null, Typeface.BOLD);
                  b.setPadding(dp(4), 0, dp(4), 0);
                  GradientDrawable gd = new GradientDrawable(
                          GradientDrawable.Orientation.TOP_BOTTOM,
                          new int[]{Color.parseColor(cTop), Color.parseColor(cBot)});
                  gd.setCornerRadius(dp(10));
                  gd.setStroke(dp(1.5f), Color.parseColor(strokeHex));
                  b.setBackground(gd);
                  return b;
              }

              private void showLobby() {
                  isGameActive = false;
                  rootContainer.removeAllViews();
