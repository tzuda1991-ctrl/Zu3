                  btnSeeCards.setOnClickListener(v -> seePlayerCards());
                  gameLayout.addView(btnSeeCards, seeLp);

                  // Bottom Docked Casino Control Bar
                  LinearLayout bottomBar = new LinearLayout(this);
                  bottomBar.setGravity(Gravity.CENTER);
                  bottomBar.setBackgroundColor(Color.parseColor("#CC080404"));
