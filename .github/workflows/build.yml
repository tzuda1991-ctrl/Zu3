                  FrameLayout.LayoutParams seeLp = new FrameLayout.LayoutParams(dp(105), dp(32), Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL);
                  seeLp.bottomMargin = dp(82);
                  seeLp.leftMargin = dp(68);
                  btnSeeCards.setOnClickListener(v -> seePlayerCards());
                  gameLayout.addView(btnSeeCards, seeLp);

                  // Bottom Casino Control Dock
                  LinearLayout bottomBar = new LinearLayout(this);
                  bottomBar.setGravity(Gravity.CENTER);
                  bottomBar.setBackgroundColor(Color.parseColor("#D908030D"));
                  bottomBar.setPadding(dp(10), dp(4), dp(10), dp(4));
                  FrameLayout.LayoutParams barLp = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, dp(46), Gravity.BOTTOM);

                  btnPack = makeBtn("PACK", "#E53935", "#B71C1C", "#FF8A80", 11);
                  LinearLayout.LayoutParams lpPack = new LinearLayout.LayoutParams(dp(84), dp(36));
                  lpPack.rightMargin = dp(6);
                  btnPack.setLayoutParams(lpPack);

                  btnSideshow = makeBtn("SIDESHOW", "#00897B", "#004D40", "#80CBC4", 10);
                  LinearLayout.LayoutParams lpSide = new LinearLayout.LayoutParams(dp(92), dp(36));
