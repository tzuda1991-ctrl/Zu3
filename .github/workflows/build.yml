              // ================= 4. 3D NEON RAY-TRACED CASINO ENGINE (REPLICA OF 2ND PIC) =================

              private class RayTracedCasinoView extends View {
                  private boolean isLobbyBg;
                  private Paint pBg = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Paint pNeon = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Paint pRim = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Paint pFelt = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Paint pStroke = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Paint pFill = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Paint pText = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private RectF rOuter = new RectF();
                  private RectF rGoldRim = new RectF();
                  private RectF rFelt = new RectF();
                  private RectF rBox = new RectF();
                  private RectF rArc = new RectF();

                  RayTracedCasinoView(Context c, boolean isLobbyBg) {
                      super(c);
                      this.isLobbyBg = isLobbyBg;
                      pText.setTypeface(Typeface.create(Typeface.DEFAULT, Typeface.BOLD));
                      pText.setFakeBoldText(true);
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      int w = getWidth();
                      int h = getHeight();
                      if (w <= 0 || h <= 0) return;

                      // 1. 3D Casino VIP Room Background (Pillars, Neon Tubes & Glowing Spade/Heart Holograms)
                      draw3DCasinoRoomBackdrop(canvas, w, h);

                      // 2. 3D Metallic Gold & Neon Purple Casino Table
                      draw3DRayTracedTable(canvas, w, h);

                      if (isLobbyBg) return;

                      // 3. Top Crown Live Dealer & Glowing Mode Banner
                      drawTopDealerAndNeonHeader(canvas, w, h);

                      // 4. Center 3D Chip Stacks, Glowing Pot Pill & Trophy Banner
                      drawCenter3DChipStacksAndPot(canvas, w, h);

                      // 5. Animated Flying Chip (When someone bets)
                      if (flyingChipProgress < 1f) {
                          float[] sx = {w * 0.40f, w * 0.14f, w * 0.86f};
                          float[] sy = {h * 0.72f, h * 0.45f, h * 0.45f};
                          float fx = sx[flyingChipFromSeat] + (w * 0.5f - sx[flyingChipFromSeat]) * flyingChipProgress;
                          float fy = sy[flyingChipFromSeat] + (h * 0.30f - sy[flyingChipFromSeat]) * flyingChipProgress;
                          drawSingle3DChip(canvas, fx, fy, dp(13), "#FF1744");
                      }

                      // 6. SEAT 1 (LEFT: RAVI PRO with Gold Laurel Wreath & Cards)
                      if (activeSeat[1]) {
                          drawWreathPlayerSeat(canvas, 1, w * 0.14f, h * 0.46f, w * 0.27f, h * 0.43f);
                      }

                      // 7. SEAT 2 (RIGHT: PRIYA VIP with Gold Laurel Wreath & Cards)
                      if (activeSeat[2]) {
                          drawWreathPlayerSeat(canvas, 2, w * 0.86f, h * 0.46f, w * 0.73f, h * 0.43f);
                      }

                      // 8. SEAT 0 (BOTTOM: U VIP with Gold Crown, Wreath & Cards)
                      drawWreathPlayerSeat(canvas, 0, w * 0.41f, h * 0.72f, w * 0.56f, h * 0.69f);

                      // 9. Admin Spy Overlay
                      if (isPeekActive && hands[1][0] != null) {
                          pText.setTextSize(dp(10));
                          pText.setColor(Color.parseColor("#FF5252"));
                          pText.setTextAlign(Paint.Align.CENTER);
                          String spy = "🕵️ SPY RAVI:[" + hands[1][0].ShortStr() + " " + hands[1][1].ShortStr() + " " + hands[1][2].ShortStr() + "]";
                          if (activeSeat[2] && hands[2][0] != null) {
                              spy += " PRIYA:[" + hands[2][0].ShortStr() + " " + hands[2][1].ShortStr() + " " + hands[2][2].ShortStr() + "]";
                          }
                          canvas.drawText(spy, w * 0.5f, h * 0.22f, pText);
                      }
                  }

                  private void draw3DCasinoRoomBackdrop(Canvas canvas, int w, int h) {
                      // Deep Dark Cyber-Casino Room Gradient
                      pBg.setShader(new LinearGradient(0, 0, 0, h,
                              Color.parseColor("#0B0314"), Color.parseColor("#040108"), Shader.TileMode.CLAMP));
                      canvas.drawRect(0, 0, w, h, pBg);

                      // Left & Right Golden Architectural Columns
                      pFill.setShader(new LinearGradient(0, 0, w * 0.08f, 0,
                              Color.parseColor("#3E2208"), Color.parseColor("#0D0602"), Shader.TileMode.MIRROR));
                      canvas.drawRect(w * 0.01f, 0, w * 0.05f, h * 0.45f, pFill);
                      canvas.drawRect(w * 0.95f, 0, w * 0.99f, h * 0.45f, pFill);
                      pFill.setShader(null);

                      // Glowing Pink Spade (Left Wall) & Heart (Right Wall) Neon Signs (Exact match to 2nd Pic!)
                      pText.setTextAlign(Paint.Align.CENTER);
                      pText.setTextSize(dp(36));
                      pText.setColor(Color.argb(110 + (int)(glowPulse * 70), 255, 64, 180));
                      pText.setShadowLayer(dp(14), 0, 0, Color.parseColor("#FF00A0"));
                      canvas.drawText("♠", w * 0.145f, h * 0.20f, pText);
                      canvas.drawText("♥", w * 0.855f, h * 0.20f, pText);
                      pText.setShadowLayer(0, 0, 0, 0);

                      // Horizontal Purple Laser Neon Strips Across Wall
                      pStroke.setStyle(Paint.Style.STROKE);
                      pStroke.setStrokeWidth(dp(2.5f));
                      pStroke.setColor(Color.parseColor("#D500F9"));
                      pStroke.setShadowLayer(dp(10), 0, 0, Color.parseColor("#AA00FF"));
                      canvas.drawLine(0, h * 0.27f, w * 0.30f, h * 0.30f, pStroke);
                      canvas.drawLine(w * 0.70f, h * 0.30f, w, h * 0.27f, pStroke);
                      canvas.drawRect(w * 0.30f, h * 0.115f, w * 0.70f, h * 0.19f, pStroke);
                      pStroke.setShadowLayer(0, 0, 0, 0);
                  }

                  private void draw3DRayTracedTable(Canvas canvas, int w, int h) {
                      float padX = w * 0.025f;
                      float padTop = h * 0.16f;
                      float padBot = h * 0.12f;

                      // 1. Under-Table Purple/Gold Pedestal Shadow & Glow
                      RectF rBase = new RectF(padX + dp(10), padTop + dp(18), w - padX - dp(10), h - padBot + dp(14));
                      pFill.setColor(Color.parseColor("#180624"));
                      canvas.drawOval(rBase, pFill);
                      pStroke.setStrokeWidth(dp(3));
                      pStroke.setColor(Color.parseColor("#9C27B0"));
                      canvas.drawOval(rBase, pStroke);

                      // 2. Outer 3D Dark Bronze/Leather Bumper
                      rOuter.set(padX, padTop, w - padX, h - padBot);
                      pRim.setShader(new LinearGradient(0, padTop, 0, h - padBot,
                              Color.parseColor("#3B2210"), Color.parseColor("#120904"), Shader.TileMode.CLAMP));
                      canvas.drawOval(rOuter, pRim);

                      // 3. Electric Purple Neon Tube Embedded in Rim (Exact match to 2nd Pic!)
                      RectF rNeon = new RectF(rOuter.left + dp(6), rOuter.top + dp(6), rOuter.right - dp(6), rOuter.bottom - dp(6));
                      pStroke.setStrokeWidth(dp(3.5f));
                      pStroke.setColor(Color.parseColor("#E040FB"));
                      pStroke.setShadowLayer(dp(12), 0, 0, Color.parseColor("#D500F9"));
                      canvas.drawOval(rNeon, pStroke);
                      pStroke.setShadowLayer(0, 0, 0, 0);

                      // 4. Thick 3D Metallic Gold Bevel Rail
                      float goldInset = dp(14);
                      rGoldRim.set(rOuter.left + goldInset, rOuter.top + goldInset, rOuter.right - goldInset, rOuter.bottom - goldInset);
                      pRim.setShader(new LinearGradient(w * 0.2f, rGoldRim.top, w * 0.8f, rGoldRim.bottom,
                              new int[]{Color.parseColor("#FFF59D"), Color.parseColor("#FFB300"), Color.parseColor("#795548"), Color.parseColor("#FFD54F"), Color.parseColor("#FF8F00")},
                              null, Shader.TileMode.CLAMP));
                      canvas.drawOval(rGoldRim, pRim);

                      // 5. Lush 3D Emerald Velvet Felt with Procedural Grain Texture
                      float feltInset = dp(14);
                      rFelt.set(rGoldRim.left + feltInset, rGoldRim.top + feltInset, rGoldRim.right - feltInset, rGoldRim.bottom - feltInset);
                      pFelt.setShader(new RadialGradient(w * 0.5f, rFelt.centerY(), rFelt.width() * 0.52f,
                              Color.parseColor("#17A558"), Color.parseColor("#043819"), Shader.TileMode.CLAMP));
                      canvas.drawOval(rFelt, pFelt);

                      // Inner Golden Felt Ring
                      RectF rInLine = new RectF(rFelt.left + dp(8), rFelt.top + dp(8), rFelt.right - dp(8), rFelt.bottom - dp(8));
                      pStroke.setStrokeWidth(dp(1.5f));
                      pStroke.setColor(Color.parseColor("#88FFD700"));
                      canvas.drawOval(rInLine, pStroke);

                      // Specular Gold Flares on Rim (Bottom Left, Bottom Right, Top Left, Top Right)
                      drawGoldSparkle(canvas, rGoldRim.left + rGoldRim.width() * 0.16f, rGoldRim.bottom - dp(18));
                      drawGoldSparkle(canvas, rGoldRim.right - rGoldRim.width() * 0.18f, rGoldRim.bottom - dp(18));
                      drawGoldSparkle(canvas, rGoldRim.left + rGoldRim.width() * 0.28f, rGoldRim.top + dp(6));
                      drawGoldSparkle(canvas, rGoldRim.right - rGoldRim.width() * 0.28f, rGoldRim.top + dp(6));
                  }

                  private void drawGoldSparkle(Canvas canvas, float x, float y) {
                      float r = dp(18 + glowPulse * 8);
                      pFill.setShader(new RadialGradient(x, y, r,
                              Color.argb(230, 255, 255, 210), Color.argb(0, 255, 215, 0), Shader.TileMode.CLAMP));
                      canvas.drawCircle(x, y, r, pFill);
                      pFill.setShader(null);
                  }

                  private void drawTopDealerAndNeonHeader(Canvas canvas, int w, int h) {
                      float cx = w * 0.5f;

                      // 3D Gold Crown sitting on top of LIVE DEALER Pill
                      pText.setTextAlign(Paint.Align.CENTER);
