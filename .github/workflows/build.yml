              private void selectVariation(int idx) {
                  currentVariation = idx;
                  for (int i = 0; i < 4; i++) {
                      GradientDrawable gd = new GradientDrawable(
                              GradientDrawable.Orientation.TOP_BOTTOM,
                              i == idx ? new int[]{Color.parseColor("#E91E63"), Color.parseColor("#880E4F")}
                                       : new int[]{Color.parseColor("#37474F"), Color.parseColor("#263238")});
                      gd.setCornerRadius(dp(10));
                      gd.setStroke(dp(i == idx ? 2.5f : 1f), Color.parseColor(i == idx ? "#FFD700" : "#78909C"));
                      btnVarModes[i].setBackground(gd);
                  }
              }

              // ================= V5 GAME TABLE UI =================

