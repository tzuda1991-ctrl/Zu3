              // ================= 4. LUXURY 3D CASINO RENDERER (NO '8' CHIPS! REAL ₹200/₹400 CHIPS!) =================

              private class LuxuryCasinoSurface extends View {
                  private boolean isLobbyBg;
                  private Paint pBg = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Paint pRim = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Paint pFelt = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Paint pStroke = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Paint pDash = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Paint pFill = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private Paint pText = new Paint(Paint.ANTI_ALIAS_FLAG);
                  private RectF rOuter = new RectF();
                  private RectF rGoldRim = new RectF();
                  private RectF rFelt = new RectF();
                  private RectF rBox = new RectF();
                  private RectF rArc = new RectF();

                  LuxuryCasinoSurface(Context c, boolean isLobbyBg) {
                      super(c);
                      this.isLobbyBg = isLobbyBg;
                      pText.setTypeface(Typeface.create(Typeface.DEFAULT, Typeface.BOLD));
                      pText.setFakeBoldText(true);
                      pDash.setStyle(Paint.Style.STROKE);
                      pDash.setPathEffect(new DashPathEffect(new float[]{dp(4), dp(3)}, 0));
                  }

                  @Override
                  protected void onDraw(Canvas canvas) {
                      super.onDraw(canvas);
                      int w = getWidth();
                      int h = getHeight();
                      if (w <= 0 || h <= 0) return;

                      // 1. Luxury Royal Monte-Carlo Velvet & Gold Room Floor
                      drawLuxuryMonteCarloBackdrop(canvas, w, h);

                      // 2. 3D Leather Cushion, Gold Inlay & Emerald Felt Table
                      draw3DRoyalCasinoTable(canvas, w, h);

                      if (isLobbyBg) return;

                      // 3. Top Dealer Trajectory & Mode Info
                      drawDealerAndTableHeader(canvas, w, h);

                      // 4. Center Pot Box & Real-Denomination Casino Chips Pile (₹100, ₹200, ₹400, ₹800)
                      drawCenterPotAndRealChips(canvas, w, h);

                      // 5. SEAT 1 (LEFT: RAVI PRO)
                      if (activeSeat[1]) {
                          drawVIPPlayerPodAndCards(canvas, 1, w * 0.14f, h * 0.46f, w * 0.275f, h * 0.44f);
                      }

                      // 6. SEAT 2 (RIGHT: PRIYA VIP)
                      if (activeSeat[2]) {
                          drawVIPPlayerPodAndCards(canvas, 2, w * 0.86f, h * 0.46f, w * 0.725f, h * 0.44f);
                      }

                      // 7. SEAT 0 (BOTTOM: YOU VIP)
                      drawVIPPlayerPodAndCards(canvas, 0, w * 0.40f, h * 0.71f, w * 0.555f, h * 0.69f);

                      // 8. LIVE FLYING CHIP ANIMATION WITH EXACT BET VALUE (₹200 / ₹400 / ₹800)!
                      if (flyingChipProgress < 1f) {
                          float[] sx = {w * 0.40f, w * 0.14f, w * 0.86f};
                          float[] sy = {h * 0.70f, h * 0.46f, h * 0.46f};
                          float targetX = w * 0.50f;
                          float targetY = h * 0.31f;

                          float curX = sx[flyingChipFromSeat] + (targetX - sx[flyingChipFromSeat]) * flyingChipProgress;
                          // Parabolic arc trajectory so chip jumps up and lands into pot!
                          float arcLift = (float) Math.sin(flyingChipProgress * Math.PI) * dp(45);
                          float curY = sy[flyingChipFromSeat] + (targetY - sy[flyingChipFromSeat]) * flyingChipProgress - arcLift;

                          // Draw large clear animated casino chip with ₹200 / ₹400 written on it
                          drawAuthenticCasinoChip(canvas, curX, curY, dp(20), flyingChipAmount, true);

                          // Floating "+₹200" or "+₹400" text banner above the moving chip
                          pText.setTextAlign(Paint.Align.CENTER);
                          pText.setTextSize(dp(14));
                          pText.setColor(Color.parseColor("#00E676"));
                          pText.setShadowLayer(dp(4), 0, dp(2), Color.BLACK);
                          canvas.drawText("+₹" + flyingChipAmount, curX, curY - dp(24), pText);
                          pText.setShadowLayer(0, 0, 0, 0);
                      }

                      // 9. Admin Spy Overlay
                      if (isPeekActive && hands[1][0] != null) {
                          pText.setTextSize(dp(10));
                          pText.setColor(Color.parseColor("#FF5252"));
                          pText.setTextAlign(Paint.Align.CENTER);
                          String spy = "🕵️ SPY RAVI:[" + hands[1][0].ShortStr() + " " + hands[1][1].ShortStr() + " " + hands[1][2].ShortStr() + "]";
                          if (activeSeat[2] && hands[2][0] != null) {
                              spy += " PRIYA:[" + hands[2][0].ShortStr() + " " + hands[2][1].ShortStr() + " " + hands[2][2].ShortStr() + "]";
                          }
                          canvas.drawText(spy, w * 0.5f, h * 0.21f, pText);
                      }
                  }

                  private void drawLuxuryMonteCarloBackdrop(Canvas canvas, int w, int h) {
                      // Deep Warm Mahogany & Obsidian Radial Floor
                      pBg.setShader(new RadialGradient(w * 0.5f, h * 0.45f, Math.max(w, h) * 0.72f,
                              Color.parseColor("#2B1108"), Color.parseColor("#070302"), Shader.TileMode.CLAMP));
                      canvas.drawRect(0, 0, w, h, pBg);

                      // Subtle Golden Carpet Diamond Lattice Lines
                      pStroke.setStyle(Paint.Style.STROKE);
                      pStroke.setStrokeWidth(dp(0.8f));
                      pStroke.setColor(Color.parseColor("#18FFD700"));
                      int step = dpi(70);
                      for (int x = -h; x < w + h; x += step) {
                          canvas.drawLine(x, 0, x + h, h, pStroke);
                          canvas.drawLine(x, h, x + h, 0, pStroke);
                      }

                      // Top Overhead Warm Golden Casino Spotlight Cone
                      pFill.setShader(new RadialGradient(w * 0.5f, 0, w * 0.55f,
                              Color.argb(65, 255, 215, 100), Color.argb(0, 0, 0, 0), Shader.TileMode.CLAMP));
                      canvas.drawRect(0, 0, w, h, pFill);
                      pFill.setShader(null);
                  }

                  private void draw3DRoyalCasinoTable(Canvas canvas, int w, int h) {
                      float padX = w * 0.035f;
                      float padTop = h * 0.14f;
                      float padBot = h * 0.13f;

                      // 1. Heavy 3D Floor Drop Shadow under Table
                      RectF rShadow = new RectF(padX + dp(6), padTop + dp(16), w - padX - dp(6), h - padBot + dp(16));
                      pFill.setColor(Color.parseColor("#AA000000"));
                      canvas.drawOval(rShadow, pFill);

                      // 2. Outer Padded Dark Espresso Leather Armrest Cushion
                      rOuter.set(padX, padTop, w - padX, h - padBot);
                      pRim.setShader(new LinearGradient(0, padTop, 0, h - padBot,
                              new int[]{Color.parseColor("#4E2614"), Color.parseColor("#240E05"), Color.parseColor("#3E1D0E"), Color.parseColor("#140702")},
                              null, Shader.TileMode.CLAMP));
                      canvas.drawOval(rOuter, pRim);

                      // Outer Gold Bezel Trim
                      pStroke.setStrokeWidth(dp(2.5f));
                      pStroke.setColor(Color.parseColor("#D4AF37"));
                      canvas.drawOval(rOuter, pStroke);

                      // 3. Brushed 3D Gold Metallic Inner Railing
                      float railInset = dp(18);
                      rGoldRim.set(rOuter.left + railInset, rOuter.top + railInset, rOuter.right - railInset, rOuter.bottom - railInset);
                      pRim.setShader(new LinearGradient(w * 0.15f, rGoldRim.top, w * 0.85f, rGoldRim.bottom,
                              new int[]{Color.parseColor("#FFE082"), Color.parseColor("#FFA000"), Color.parseColor("#FFF8E1"), Color.parseColor("#FF8F00")},
                              null, Shader.TileMode.CLAMP));
                      canvas.drawOval(rGoldRim, pRim);

                      // 4. Deep Casino Emerald Felt with Overhead Spotlight Gradient
                      float feltInset = dp(8);
                      rFelt.set(rGoldRim.left + feltInset, rGoldRim.top + feltInset, rGoldRim.right - feltInset, rGoldRim.bottom - feltInset);
                      pFelt.setShader(new RadialGradient(w * 0.5f, rFelt.centerY() - dp(15), rFelt.width() * 0.52f,
                              new int[]{Color.parseColor("#1B8A4E"), Color.parseColor("#0A5C30"), Color.parseColor("#042E16")},
                              new float[]{0f, 0.68f, 1f}, Shader.TileMode.CLAMP));
                      canvas.drawOval(rFelt, pFelt);

                      // Inner Shadow along Felt Edge for 3D Depth
                      pStroke.setStrokeWidth(dp(4));
                      pStroke.setColor(Color.parseColor("#55000000"));
                      canvas.drawOval(rFelt, pStroke);

                      // Inner Double Gold Betting Line with Corner Diamond Pips
                      RectF rBetLine = new RectF(rFelt.left + dp(14), rFelt.top + dp(14), rFelt.right - dp(14), rFelt.bottom - dp(14));
                      pStroke.setStrokeWidth(dp(1.2f));
                      pStroke.setColor(Color.parseColor("#77FFD700"));
                      canvas.drawOval(rBetLine, pStroke);

                      // Subtle Watermark Suit Symbols on Felt Center
                      pText.setTextAlign(Paint.Align.CENTER);
                      pText.setTextSize(dp(22));
                      pText.setColor(Color.parseColor("#16FFFFFF"));
                      canvas.drawText("♠   ♥   ♣   ♦", w * 0.5f, rFelt.centerY() + dp(52), pText);
                  }

