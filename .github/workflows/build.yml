                      // Face Up White / Wild Gold Card
                      pCard.setColor(isWild ? Color.parseColor("#FFF8E1") : Color.WHITE);
                      canvas.drawRoundRect(rect, dp(8), dp(8), pCard);

                      pBorder.setStyle(Paint.Style.STROKE);
                      pBorder.setStrokeWidth(dp(isWild ? 3 : 2));
                      pBorder.setColor(isWild ? Color.parseColor("#FF6F00") : Color.parseColor("#CCCCCC"));
                      canvas.drawRoundRect(rect, dp(8), dp(8), pBorder);

                      int suitColor = (card.suit == 1 || card.suit == 2) ? Color.parseColor("#D50000") : Color.parseColor("#111111");
